[package]
name = "lavender_moogle"
version = "0.1.0"
edition = "2021"

[dependencies]
memmap2 = "0.5"
lazy_static = "1.4"
winapi = { version = "0.3", features = ["fileapi", "handleapi", "memoryapi", "winnt"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
env_logger = "0.9"
calamine = "0.20.0"
hyper = { version = "0.14", features = ["full", "server"] }  # Enable the "server" feature
tokio = { version = "1", features = ["full"] }
once_cell = "1.10.0"
