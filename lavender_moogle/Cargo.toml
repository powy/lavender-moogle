[package]
name = "screener"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
memmap2 = "0.5"
lazy_static = "1.4"
winapi = { version = "0.3", features = ["fileapi", "handleapi", "memoryapi", "winnt"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
env_logger = "0.9"
calamine = "0.20.0"
